version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: chat_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: chat_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 10s
      retries: 5
      start_period: 15s

  # Optional local Firestore Emulator (no cloud account needed)
  firestore-emulator:
    image: google/cloud-sdk:alpine
    container_name: chat_firestore_emulator
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    environment:
      - CLOUDSDK_CORE_PROJECT=chat-backend-dev

volumes:
  mysql_data:
